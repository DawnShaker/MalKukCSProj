services:
  - type: web
    name: realestate-security
    runtime: docker
    plan: free
    region: frankfurt
    branch: security-integration
    dockerfilePath: integrations/security/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Security
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: real-estate-security
      - key: Jwt__Audience
        value: real-estate-agency
      - key: BootstrapAdmin__Username
        sync: false
      - key: BootstrapAdmin__Password
        sync: false
